name: Build outbox forwarder image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      root_tag:
        description: Existing root release tag to backfill for the nested Go module (for example, v1.7.1)
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/outbox-forwarder
  TARGET_PLATFORMS: linux/arm64,linux/amd64

jobs:
  build-pr-image:
    name: Build service image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: outbox-forwarder
          tags: |
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.TARGET_PLATFORMS }}

  release-dry-run:
    name: Resolve semantic release
    runs-on: ubuntu-latest
    environment: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic release dry run
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    name: Publish service image
    runs-on: ubuntu-latest
    needs: release-dry-run
    environment: build
    if: needs.release-dry-run.outputs.published == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ needs.release-dry-run.outputs.version }}
            type=raw,value=${{ needs.release-dry-run.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.TARGET_PLATFORMS }}

  release:
    name: Create semantic release
    runs-on: ubuntu-latest
    needs:
      - release-dry-run
      - publish-image
    environment: build
    if: needs.release-dry-run.outputs.published == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag nested Go module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-dry-run.outputs.version }}
        run: |
          set -euo pipefail
          root_tag="v${RELEASE_VERSION}"
          nested_tag="pkg/outbox/${root_tag}"
          release_commit="$(git rev-list -n 1 "${root_tag}")"

          test "$(git show "${release_commit}:pkg/outbox/go.mod" | head -n 1)" = "module github.com/petretiandrea/outbox-go/pkg/outbox"

          if git ls-remote --exit-code --tags origin "refs/tags/${nested_tag}" >/dev/null 2>&1; then
            remote_commit="$(git ls-remote origin "refs/tags/${nested_tag}^{}" | awk '{print $1}')"
            if [ -z "${remote_commit}" ]; then
              remote_commit="$(git ls-remote --refs origin "refs/tags/${nested_tag}" | awk '{print $1}')"
            fi
            test "${remote_commit}" = "${release_commit}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${nested_tag}" "${release_commit}" -m "Release ${nested_tag}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${nested_tag}"

  backfill-nested-module-tag:
    name: Backfill nested Go module tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.root_tag != ''
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.root_tag }}
          fetch-depth: 0

      - name: Publish matching nested module tag
        env:
          ROOT_TAG: ${{ inputs.root_tag }}
        run: |
          set -euo pipefail
          case "${ROOT_TAG}" in
            v[0-9]*) ;;
            *) echo "root_tag must be a semantic root tag such as v1.7.1" >&2; exit 1 ;;
          esac

          test "$(head -n 1 pkg/outbox/go.mod)" = "module github.com/petretiandrea/outbox-go/pkg/outbox"

          nested_tag="pkg/outbox/${ROOT_TAG}"
          release_commit="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/${nested_tag}" >/dev/null 2>&1; then
            remote_commit="$(git ls-remote origin "refs/tags/${nested_tag}^{}" | awk '{print $1}')"
            if [ -z "${remote_commit}" ]; then
              remote_commit="$(git ls-remote --refs origin "refs/tags/${nested_tag}" | awk '{print $1}')"
            fi
            test "${remote_commit}" = "${release_commit}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${nested_tag}" "${release_commit}" -m "Release ${nested_tag}"
          git push origin "refs/tags/${nested_tag}"
